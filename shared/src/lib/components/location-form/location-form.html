<form [formGroup]="locationForm" (ngSubmit)="onSubmit()" class="p-3 bg-gray-800 border rounded-lg shadow-md">
  <div class="mb-3">
    <label for="location-name" class="block text-sm font-medium text-gray-200">
      Location name
    </label>
    <input
      id="location-name"
      type="text"
      formControlName="placeName"
      placeholder="put the place name"
      class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    />
  </div>

  <label class="my-3 inline-flex items-center text-gray-200 text-sm ">
    <input type="checkbox" formControlName="getGeometry" class="mr-2">
    Get geometry
  </label>

  <button
    type="submit"
    [disabled]="locationForm.invalid"
    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-gray-400">
    Search location
  </button>
</form>
