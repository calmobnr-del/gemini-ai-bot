@if (message(); as session) {
  <div class="session-container mb-6 p-4 border rounded-lg shadow-md bg-white">

    @if (contentBtnTpl(); as contentBtnTpl) {
      <div class="  flex justify-end items-center gap-2">
        <ng-container *ngTemplateOutlet="contentBtnTpl"></ng-container>
      </div>
    }

    <div class="border-b border-gray-200 pb-2 mb-3">
      <div>
        <h2 class="text-lg font-semibold   pb-2 mb-2">Session ID: {{ session.id }}</h2>
        <p class="text-xs text-gray-500">Created on: {{ session.createdAt | date: 'medium' }}</p>
      </div>


    </div>


    <div class="messages-list space-y-4">
      @for (msg of session.messages; track msg.id) {


        <div class="flex justify-end ml-6">
          <div class="bg-gray-500 text-gray-100 font-semibold rounded-lg p-3 ">
            <p>{{ msg.request }}</p>
          </div>
        </div>

        <div class="bot-response bg-gray-100 text-gray-800 rounded-lg p-3 mr-10">
          <div [innerHTML]="msg.response"></div>
        </div>
      }
    </div>
  </div>
