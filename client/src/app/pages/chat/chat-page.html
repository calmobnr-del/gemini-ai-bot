<div class="container mx-auto p-4">
  <div class="chat-container my-2">
    @if (state.sessionId()) { @for(message of state.messages(); track $index) {
    <p>
      <strong>{{ message.sender }}</strong>
      : {{ message.text }}
    </p>
    } } @if (!state.sessionId() && !state.loading()){
    <p class="text-lg">Let's start a new chat...</p>
    } @if (state.loading()) {
    <p>Bot is typing...</p>
    }
  </div>

  <textarea
    class="my-2 p-2 border-2 w-full border-black rounded-md"
    #input
    (keyup.enter)="sendMessage(input)"
    placeholder="Введіть текст..."
    [disabled]="state.loading()"
  ></textarea>
</div>
