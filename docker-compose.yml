version: '3.8'

services:
  # The NestJS API Service
  api:
    build: . # Tells Docker to build the image from the Dockerfile in the current directory
    image: my-gemini-bot-api
    container_name: gemini-api
    ports:
      - "3000:3000" # Maps port 3000 on your machine to port 3000 in the container
    depends_on:
      - db # Tells this service to wait for the 'db' service to be ready
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DB_HOST=db # The hostname to connect to the database container
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}

  # The PostgreSQL Database Service
  db:
    image: postgres:15-alpine # Pulls the official PostgreSQL image from Docker Hub
    container_name: gemini-db
    ports:
      - "5432:5432" # Maps port 5432 on your machine to the container's port
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data # Persists database data on your machine

volumes:
  postgres-data: # Defines the volume for data persistence
